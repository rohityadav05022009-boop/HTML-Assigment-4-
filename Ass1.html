<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference Form</title>
</head>
<body>
    <h1>Reference Form</h1>
    <form>
        <label>Name :</label>
        <input type="Name" id="Name" placeholder="Enter your name">
        <br>
        <br>
     <label>Father Name :</label>
        <input type="Fname" id="FName" placeholder="Enter Father Name">
       <br>
       <br>
       <lable>Email :</lable>
       <input type="Email" id="Email" placeholder="Enter your Email">
       <br>
       <br>
       <lable>Gender :</lable>
       <br>
      <lable For="Gender">Male</lable>
      <input type="radio" id="Male" name="Gender" required>
      <lable for="Gender">Female</lable>
      <input type="radio" id="Female" name="Gender" required>
      <lable For="Gender">Other</lable>
      <input type="radio" id="Other" name="Gender" required>
      <br>
      <br>
      <label>DOB :</label>
      <input type="date" name="DOB">
      <br>
      <br>
      <lable>Address:</lable>
      <textarea name="Address" id="Address" rows="5" cols="17"></textarea>
      <br>
      <br>
      <label>Course :</label>
      <select>
        <option>Cs</option>
        <option>Me</option>
        <option>EE</option>
      </select>
      <br>
      <br>
      <label>Upload Resume</label>
      <input type="File">
      <br>
      <br
      <label>Hobbies</label>
      <label>Cricket</label>
      <input type="checkbox" id="Cricket" name="Hobbies" required>
      <label>Hockey</label>
      <input type="checkbox" id="Hockey" name="Hobbies" required>
      <lable>Ludo</lable>
      <input type="checkbox" id="Ludo" name="Hobbies" required>
      <br>
      <br>
      <button>Submit Me</button>
    </form>
    
</body>
</html>
