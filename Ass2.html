<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <h1>Assignment 2-Feedback Form</h1>
    <hr>
    <br>
    <form>
        <label> Name:</label>
        <input type="Name" id="Name" placeholder="Enter name" required>
        <br>
        <br>

        <input type="Email" id="Email" placeholder="Enter Email" required>
        <br>
        <br>

        <br>

        <input type="checkbox" id="Angry"><br>
        <label>Sad</label>
        <input type="checkbox" id="Sad"><br>
        <label>Happy</label>
        <input type="checkbox" id="Happy"><br>
        <lable>Ambivalent</lable>
        <input type="checkbox" id="Ambivalent">
        <br>
        <p><b>How satisfied were you with our service?</b></p>
        <br>
        <label>Very satisfied</label><br>
        <input type="radio" id="Very satisfied" name="Very satisfied">
        <label>Satisfied</label><br>
        <input type="radio" id="Satisfied" name="Satisfied">
        <label>Did nat care</label><br>
        <input type="radio" id="Did nat care" name="Did nat care">
        <label>Dissatified</label><br>
        <input type="radio" id="Dissatified" name="Dissatified">
        <label>Very dissatified</label><br>
        <input type="radio" id="Very dissatified" name="Very dissatified">
        <br>
        <br>
        <label>Further Comments:</label>
        <textarea rows="4" cols="17"></textarea>
        <br><br>
        <label>Bio photo :</label>
        <textarea></textarea>
        <input type="file">
        <br>
        <br>
        <lable>Location Visited</lable>
        <select>
            <option>None</option>
            <option>Lucknow</option>
            <option>Deoria</option>
            <option>Gorakhpur</option>
            <option>Mahoba</option>
        </select>
        <br>
        <br>
        <button>Submit</button>
        

    </form>
  
</body>
</html>
